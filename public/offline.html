<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBay Lister – offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;background:#fff;color:#111;padding:24px;box-sizing:border-box;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#000;color:#eee}}
  button{margin-top:16px;padding:12px 20px;border-radius:999px;border:0;background:#0f766e;color:#fff;font-size:16px}
</style>
</head>
<body>
  <div>
    <h1>You're offline</h1>
    <p>eBay Lister needs a connection to look up prices and post listings.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
