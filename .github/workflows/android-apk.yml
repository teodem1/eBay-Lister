# Builds a debug APK you can install on your phone.
# Run it from the Actions tab ("Build Android APK" > Run workflow), then
# download the "ebay-lister-debug-apk" artifact from the run page.
# Set the repository variable CAP_SERVER_URL (Settings > Secrets and variables
# > Actions > Variables) to your hosted server, e.g. https://ebay-lister.vercel.app
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server URL the app loads (defaults to the CAP_SERVER_URL variable)"
        required: false
  push:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor-shell/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || vars.CAP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run cap:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ebay-lister-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
