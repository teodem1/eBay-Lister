<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBay Lister</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:system-ui,sans-serif;background:#fff;color:#111;padding:24px;box-sizing:border-box;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#000;color:#eee}}
  button{margin-top:16px;padding:12px 20px;border-radius:999px;border:0;background:#0f766e;color:#fff;font-size:16px}
</style>
<!-- Written by scripts/cap-shell.mjs at sync time. -->
<script src="server.js"></script>
</head>
<body>
  <div>
    <h1>Can't reach eBay Lister</h1>
    <p id="msg">Check your connection and try again.</p>
    <button id="retry">Try again</button>
  </div>
  <script>
    var url = window.CAP_SERVER_URL;
    if (!url) {
      document.getElementById("msg").textContent =
        "This build has no server address. Rebuild it with CAP_SERVER_URL set.";
    }
    document.getElementById("retry").onclick = function () {
      if (url) location.href = url; else location.reload();
    };
  </script>
</body>
</html>
